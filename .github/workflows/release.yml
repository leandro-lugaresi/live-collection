name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Don't publish from forks or PRs: secrets.GITHUB_TOKEN is the only auth.
    if: github.event_name == 'push' && github.repository == 'leandro-lugaresi/live-collection'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Authenticate against npm.pkg.github.com. The repo .npmrc already maps
      # @leandro-lugaresi/* to that registry; NODE_AUTH_TOKEN is what npm uses
      # for any URL it resolves.
      - name: Configure registry auth
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pre-publish gate: typecheck, build, test. Same commands used by CI.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      # changesets/action opens a "Version Packages" PR; merging it (or pushing
      # directly to main with no pending changesets) triggers publish.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}